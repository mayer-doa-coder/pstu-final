name: money-movement

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-money_movement}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money_movement}
      POSTGRES_DB: ${POSTGRES_DB:-money_movement}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-money_movement} -d ${POSTGRES_DB:-money_movement}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies pending Prisma migrations, then exits. api/worker wait
  # for it to succeed before starting.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command:
      [
        'node',
        'node_modules/prisma/build/index.js',
        'migrate',
        'deploy',
        '--schema',
        'database/prisma/schema.prisma',
      ]
    working_dir: /repo
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-money_movement}:${POSTGRES_PASSWORD:-money_movement}@postgres:5432/${POSTGRES_DB:-money_movement}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/main.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-money_movement}:${POSTGRES_PASSWORD:-money_movement}@postgres:5432/${POSTGRES_DB:-money_movement}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Required by the env schema (no default — a money service must never
      # boot with a guessable signing key). The fallback here is for local
      # `docker compose up` only; override via .env / real secrets elsewhere.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-0123456789abcdef0123456789}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      INITIAL_WALLET_BALANCE_MINOR: ${INITIAL_WALLET_BALANCE_MINOR:-10000000}
      DAILY_TRANSFER_LIMIT_MINOR: ${DAILY_TRANSFER_LIMIT_MINOR:-100000000}
      WEEKLY_TRANSFER_LIMIT_MINOR: ${WEEKLY_TRANSFER_LIMIT_MINOR:-300000000}
      MONTHLY_TRANSFER_LIMIT_MINOR: ${MONTHLY_TRANSFER_LIMIT_MINOR:-1000000000}
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:4000/api/v1/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-money_movement}:${POSTGRES_PASSWORD:-money_movement}@postgres:5432/${POSTGRES_DB:-money_movement}?schema=public
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The worker boots the same AppConfigModule as the API, which validates
      # the full env schema — so it needs the (defaultless) JWT secret too.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me-0123456789abcdef0123456789}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      INITIAL_WALLET_BALANCE_MINOR: ${INITIAL_WALLET_BALANCE_MINOR:-10000000}
      # Optional: only the worker calls the OpenAI API (to gloss a HIGH-risk
      # transfer in plain language). Unset/empty = that one follow-up step
      # no-ops; the deterministic risk engine is unaffected.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000/api/v1}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
